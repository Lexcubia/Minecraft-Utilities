[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modpack-updater"
version = "0.1.0"
description = "Minecraft 整合包升级：Python 引擎 CLI（与 Tauri 桌面端配合）"
authors = [{ name = "Lexcubia" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<0.29",
    "pydantic>=2.6,<3",
    "typer>=0.12,<0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
modpack-updater = "modpack_updater.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["python/modpack_updater"]

[tool.ruff]
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
