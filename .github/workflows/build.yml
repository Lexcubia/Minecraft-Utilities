# 在 `release` 分支上打包多平台安装包，产物供 release.yml 工作流上传。
# 触发：合并 / 推送到 `release`，或手动 workflow_dispatch。

name: build

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tauri-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri build (${{ matrix.os }})
        run: pnpm exec tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Stage bundle files
        shell: bash
        run: |
          mkdir -p upload
          if [ -d src-tauri/target/release/bundle ]; then
            while IFS= read -r -d '' f; do
              cp -f "$f" "upload/$(basename "$f")"
            done < <(find src-tauri/target/release/bundle -type f \( \
              -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o \
              -name '*.AppImage' -o -name '*.deb' \
            \) -print0)
          fi
          ls -la upload

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: upload/
          if-no-files-found: error
