# 在 build 工作流成功后：从 CHANGELOG 读取说明，创建/更新 GitHub Release 并上传产物。
# 注意：workflow_run 触发时，本文件以仓库默认分支上的版本为准（GitHub 行为）。

name: release

on:
  workflow_run:
    workflows: [build.yml]
    types:
      - completed

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'release' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Download build artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          path: release-files

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import pathlib
          import re

          ver = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))["version"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = re.compile(rf"^## \[{re.escape(ver)}\][^\n]*\n", re.MULTILINE)
          m = pat.search(text)
          if not m:
              raise SystemExit(f"No ## [{ver}] section in CHANGELOG.md (must match package.json version)")
          rest = text[m.end() :]
          m2 = re.search(r"^## \[", rest, re.MULTILINE)
          body = (rest[: m2.start()] if m2 else rest).strip()
          if not body:
              raise SystemExit(f"Empty changelog body under ## [{ver}]")
          pathlib.Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"version={ver}")
          PY

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          TAG="v${VERSION}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          mapfile -t assets < <(find release-files -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o \
            -name '*.AppImage' -o -name '*.deb' \
          \) | sort -u)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No bundle files under release-files; failing.'
            find release-files -type f -maxdepth 6 || true
            exit 1
          fi
          TITLE="minecraft-modpack-updater ${TAG}"
          if gh release view "${TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists; uploading assets and refreshing notes."
            for f in "${assets[@]}"; do
              gh release upload "${TAG}" "$f" --clobber --repo "${GH_REPO}"
            done
            gh release edit "${TAG}" --notes-file release_notes.md --title "${TITLE}" --repo "${GH_REPO}"
          else
            echo "Creating release ${TAG} at ${SHA}"
            gh release create "${TAG}" "${assets[@]}" \
              --repo "${GH_REPO}" \
              --target "${SHA}" \
              --title "${TITLE}" \
              --notes-file release_notes.md
          fi
          echo "Done: ${TAG}"
