# 在 `main` 上合并后：若 package.json 版本尚无 git 标签，且 CHANGELOG 中该版本小节含 `<!-- release:publish -->`，
# 则执行多平台 Tauri 打包并创建/更新 GitHub Release。
# 产物（共 6 个，与 `mainBinaryName` / 版本号一致）：
#   minecraft-utilities-linux-{x86_64|aarch64}-v{x.x.x}.tar.gz  ×2
#   minecraft-utilities-win-{x86_64|aarch64}-v{x.x.x}.zip       ×2
#   minecraft-utilities-macos-{aarch64|x86_64}-v{x.x.x}.dmg     ×2（Tauri `--bundles dmg`）
# Linux / Windows 免安装包在 `build/desktop/`；mac DMG 由 Tauri 写入 `build/cargo-target/release/bundle/dmg/` 再拷贝到 `upload/`。
# `tauri.conf.json` 中 `bundle.active: false`，默认不生成 NSIS/MSI 等；mac 矩阵显式 `--bundles dmg`。
# Windows 应用内更新：下载对应架构 zip 并解压到临时目录后打开资源管理器。
#
# 分支策略：请在 GitHub 仓库设置中为 `main` 开启「禁止直接推送」，仅允许经 PR 合并写入。

name: desktop-release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.pick.outputs.release }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect publish intent
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          # 标签不存在时 rev-parse 非零退出；勿在 set -e 下直接用作条件，否则脚本会中断。
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; skip."
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "No tag v${VERSION} yet; evaluating CHANGELOG marker."
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          ver = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))["version"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## \[{re.escape(ver)}\][^\n]*\n", re.MULTILINE)
          m = heading.search(text)
          if not m:
              print(f"No CHANGELOG section ## [{ver}]")
              pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write("release=false\n")
              sys.exit(0)
          rest = text[m.end() :]
          m2 = re.search(r"^## ", rest, re.MULTILINE)
          body = (rest[: m2.start()] if m2 else rest)
          marker = "<!-- release:publish -->"
          if marker not in body:
              print(f"CHANGELOG ## [{ver}] has no {marker}; skip release.")
              pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write("release=false\n")
              sys.exit(0)
          print(f"Will release v{ver} (marker present, tag absent).")
          pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write("release=true\n")
          PY

  tauri-build:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-24.04
            pack: linux-tar
            target_arch: x86_64
            mac_cpu: ''
          - id: linux-aarch64
            os: ubuntu-24.04-arm
            pack: linux-tar
            target_arch: aarch64
            mac_cpu: ''
          - id: win-x86_64
            os: windows-latest
            pack: win-zip
            target_arch: ''
            mac_cpu: ''
          - id: win-aarch64
            os: windows-11-arm
            pack: win-zip
            target_arch: ''
            mac_cpu: ''
          - id: macos-aarch64
            os: macos-latest
            pack: mac-dmg
            target_arch: ''
            mac_cpu: aarch64
          # macos-13 已于 2025-12-04 退役；Intel/x86_64 使用官方替代标签（见 GitHub Changelog）。
          - id: macos-x86_64
            os: macos-15-intel
            pack: mac-dmg
            target_arch: ''
            mac_cpu: x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.pack == 'linux-tar'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      # macOS：Homebrew rust/rustup 的 cargo 可能指向损坏的 rustup-init（runner-images#14097）
      - name: Remove broken Homebrew rust (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for pkg in rust rustup rustup-init; do
            brew unlink "$pkg" 2>/dev/null || true
            brew uninstall --ignore-dependencies "$pkg" 2>/dev/null || true
          done
          for shim in /opt/homebrew/bin/cargo /opt/homebrew/bin/rustc /opt/homebrew/bin/rustup /opt/homebrew/bin/rustup-init; do
            if [ -e "$shim" ]; then
              rm -f "$shim"
            fi
          done

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Prefer rustup cargo on PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"

      - name: Verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          CARGO_BIN="$(command -v cargo)"
          echo "cargo=${CARGO_BIN}"
          case "$CARGO_BIN" in
            *homebrew*|*rustup-init*) echo "Broken cargo shim on PATH"; exit 1 ;;
          esac
          cargo --version
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> build/cargo-target
          key: ${{ matrix.id }}
          # 避免缓存/还原 Homebrew 的 cargo  shim（macOS runner-images#14097）
          cache-bin: ${{ runner.os != 'macOS' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri build (Linux portable)
        if: matrix.pack == 'linux-tar'
        run: pnpm exec tauri build --ci --no-bundle

      - name: Pack Linux tarball
        if: matrix.pack == 'linux-tar'
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: node scripts/pack-linux-tarball.mjs

      - name: Tauri build (Windows portable)
        if: matrix.pack == 'win-zip'
        run: pnpm exec tauri build --ci --no-bundle

      - name: Pack Windows portable zip
        if: matrix.pack == 'win-zip'
        run: node scripts/pack-windows-portable.mjs

      - name: Tauri build (macOS dmg)
        if: matrix.pack == 'mac-dmg'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          CARGO_BIN="$(command -v cargo)"
          echo "cargo=${CARGO_BIN}"
          case "$CARGO_BIN" in
            *homebrew*|*rustup-init*) echo "Broken cargo shim on PATH"; exit 1 ;;
          esac
          pnpm exec tauri build --ci --bundles dmg

      - name: Collect release assets into upload/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          VERSION="$(jq -r .version package.json)"
          if [ "${{ matrix.pack }}" = "mac-dmg" ]; then
            DMG="$(find build/cargo-target/release/bundle/dmg -name '*.dmg' | head -n 1)"
            test -n "$DMG"
            cp -f "$DMG" "upload/minecraft-utilities-macos-${{ matrix.mac_cpu }}-v${VERSION}.dmg"
          fi
          if [ "${{ matrix.pack }}" = "linux-tar" ]; then
            find build/desktop -type f -name '*.tar.gz' -exec cp -f {} upload/ \;
          fi
          if [ "${{ matrix.pack }}" = "win-zip" ]; then
            find build/desktop -type f -name '*.zip' -exec cp -f {} upload/ \;
          fi
          ls -la upload
          node scripts/assert-release-assets.mjs matrix

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.id }}
          path: upload/
          if-no-files-found: error

  publish:
    needs: [detect, tauri-build]
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          pattern: bundle-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import pathlib
          import re

          ver = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))["version"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = re.compile(rf"^## \[{re.escape(ver)}\][^\n]*\n", re.MULTILINE)
          m = pat.search(text)
          if not m:
              raise SystemExit(f"No ## [{ver}] section in CHANGELOG.md")
          rest = text[m.end() :]
          m2 = re.search(r"^## ", rest, re.MULTILINE)
          body = (rest[: m2.start()] if m2 else rest).strip()
          body = body.replace("<!-- release:publish -->", "").strip()
          if not body:
              raise SystemExit(f"Empty changelog body under ## [{ver}] after removing release marker")
          pathlib.Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"version={ver}")
          PY

      - name: Verify merged desktop archives
        run: node scripts/assert-release-assets.mjs publish

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          TAG="v${VERSION}"
          SHA="${{ github.sha }}"
          # Bash 3.2–compatible (no mapfile)；上传统一命名的 zip / tar.gz / dmg（共 6 个平台包）。
          assets=()
          while IFS= read -r f; do
            [ -n "$f" ] && assets+=("$f")
          done < <(find release-files -type f \( \
            -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' \
          \) ! -name 'latest.fragment.*.json' | sort -u)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No bundle files under release-files; failing.'
            find release-files -type f -maxdepth 8 || true
            exit 1
          fi
          TITLE="Minecraft-Utilities-${TAG}"
          PRERELEASE_ARGS=()
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE_ARGS=(--prerelease)
            echo "Prerelease version ${VERSION}; marking GitHub Release as prerelease."
          fi
          if gh release view "${TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists; uploading assets and refreshing notes."
            for f in "${assets[@]}"; do
              gh release upload "${TAG}" "$f" --clobber --repo "${GH_REPO}"
            done
            gh release edit "${TAG}" --notes-file release_notes.md --title "${TITLE}" "${PRERELEASE_ARGS[@]}" --repo "${GH_REPO}"
          else
            echo "Creating release ${TAG} at ${SHA}"
            gh release create "${TAG}" "${assets[@]}" \
              --repo "${GH_REPO}" \
              --target "${SHA}" \
              --title "${TITLE}" \
              --notes-file release_notes.md \
              "${PRERELEASE_ARGS[@]}"
          fi
          echo "Done: ${TAG}"
