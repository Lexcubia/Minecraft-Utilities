# 在 `main` 上合并后：若 package.json 版本尚无 git 标签，且 CHANGELOG 中该版本小节含 `<!-- release:publish -->`，
# 则执行多平台 Tauri 打包并创建/更新 GitHub Release（产物文件名不含空格，见 tauri.conf.json `productName`）。
# 应用内更新：需仓库 Actions Secret `TAURI_SIGNING_PRIVATE_KEY`（可选 `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`），
# 与 `tauri.conf.json` 的 `plugins.updater.pubkey` 成对；发版会上传 `latest.json` 与 `.sig`。详见 docs/zh-cn/REPO_SETUP.md。
#
# 分支策略：请在 GitHub 仓库设置中为 `main` 开启「禁止直接推送」，仅允许经 PR 合并写入。

name: desktop-release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.pick.outputs.release }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect publish intent
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          # 标签不存在时 rev-parse 非零退出；勿在 set -e 下直接用作条件，否则脚本会中断。
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; skip."
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "No tag v${VERSION} yet; evaluating CHANGELOG marker."
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          ver = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))["version"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## \[{re.escape(ver)}\][^\n]*\n", re.MULTILINE)
          m = heading.search(text)
          if not m:
              print(f"No CHANGELOG section ## [{ver}]")
              pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write("release=false\n")
              sys.exit(0)
          rest = text[m.end() :]
          m2 = re.search(r"^## ", rest, re.MULTILINE)
          body = (rest[: m2.start()] if m2 else rest)
          marker = "<!-- release:publish -->"
          if marker not in body:
              print(f"CHANGELOG ## [{ver}] has no {marker}; skip release.")
              pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write("release=false\n")
              sys.exit(0)
          print(f"Will release v{ver} (marker present, tag absent).")
          pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write("release=true\n")
          PY

  tauri-build:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require TAURI_SIGNING_PRIVATE_KEY (GitHub updater)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo '::error title=Missing Actions secret::desktop-release 需要仓库 Secret TAURI_SIGNING_PRIVATE_KEY（minisign 私钥全文）。未配置时不会生成 bundle 内的 latest.json，发布阶段合并 updater 也会失败。说明见 docs/zh-cn/REPO_SETUP.md。'
            exit 1
          fi

      - name: Tauri build (${{ matrix.os }})
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Assert updater latest.json exists in bundle
        shell: bash
        run: |
          set -euo pipefail
          # macOS runners use Bash 3.2 (no mapfile); use read -d '' + process substitution.
          found=0
          while IFS= read -r -d '' f; do
            printf 'OK: %s\n' "$f"
            found=1
          done < <(find src-tauri/target/release/bundle -name latest.json -type f -print0 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then
            echo '::error::构建完成后在 src-tauri/target/release/bundle 下未找到 latest.json（应用内更新元数据）。请确认 TAURI_SIGNING_PRIVATE_KEY 格式正确且与 pubkey 成对，且 tauri.conf.json 中 bundle.createUpdaterArtifacts 为 true。'
            echo 'Bundle tree (max depth 5):'
            find src-tauri/target/release/bundle -type f -maxdepth 5 -print 2>/dev/null || true
            exit 1
          fi

      - name: Pack Windows portable (zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: node scripts/pack-windows-portable.mjs

      - name: Stage bundle files
        shell: bash
        env:
          FRAGMENT_SUFFIX: ${{ matrix.os }}
        run: |
          mkdir -p upload
          if [ -d src-tauri/target/release/bundle ]; then
            while IFS= read -r -d '' f; do
              cp -f "$f" "upload/$(basename "$f")"
            done < <(find src-tauri/target/release/bundle -type f \( \
              -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o \
              -name '*.AppImage' -o -name '*.deb' \
            \) -print0)
            while IFS= read -r -d '' f; do
              cp -f "$f" "upload/$(basename "$f")"
            done < <(find src-tauri/target/release/bundle -type f -name '*.sig' -print0)
            while IFS= read -r -d '' f; do
              safe="${FRAGMENT_SUFFIX//\//-}"
              cp -f "$f" "upload/latest.fragment.${safe}.json"
            done < <(find src-tauri/target/release/bundle -name latest.json -print0)
          fi
          if [ -d artifacts/portable ]; then
            while IFS= read -r -d '' f; do
              cp -f "$f" "upload/$(basename "$f")"
            done < <(find artifacts/portable -maxdepth 1 -type f -name '*.zip' -print0)
          fi
          ls -la upload

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: upload/
          if-no-files-found: error

  publish:
    needs: [detect, tauri-build]
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          pattern: bundle-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import pathlib
          import re

          ver = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))["version"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = re.compile(rf"^## \[{re.escape(ver)}\][^\n]*\n", re.MULTILINE)
          m = pat.search(text)
          if not m:
              raise SystemExit(f"No ## [{ver}] section in CHANGELOG.md")
          rest = text[m.end() :]
          m2 = re.search(r"^## ", rest, re.MULTILINE)
          body = (rest[: m2.start()] if m2 else rest).strip()
          body = body.replace("<!-- release:publish -->", "").strip()
          if not body:
              raise SystemExit(f"Empty changelog body under ## [{ver}] after removing release marker")
          pathlib.Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"version={ver}")
          PY

      - name: Merge Tauri updater latest.json
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          TAG="v${VERSION}"
          node scripts/merge-github-updater-latest.mjs \
            --root release-files \
            --tag "${TAG}" \
            --repo "${{ github.repository }}" \
            --notes-file release_notes.md \
            --out release-files/latest.json

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          TAG="v${VERSION}"
          SHA="${{ github.sha }}"
          # Bash 3.2–compatible (no mapfile); publish job is Ubuntu but keep portable.
          assets=()
          while IFS= read -r f; do
            [ -n "$f" ] && assets+=("$f")
          done < <(find release-files -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' -o \
            -name '*.sig' -o -name 'latest.json' \
          \) ! -name 'latest.fragment.*.json' | sort -u)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No bundle files under release-files; failing.'
            find release-files -type f -maxdepth 8 || true
            exit 1
          fi
          TITLE="Minecraft-Utilities-${TAG}"
          if gh release view "${TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists; uploading assets and refreshing notes."
            for f in "${assets[@]}"; do
              gh release upload "${TAG}" "$f" --clobber --repo "${GH_REPO}"
            done
            gh release edit "${TAG}" --notes-file release_notes.md --title "${TITLE}" --repo "${GH_REPO}"
          else
            echo "Creating release ${TAG} at ${SHA}"
            gh release create "${TAG}" "${assets[@]}" \
              --repo "${GH_REPO}" \
              --target "${SHA}" \
              --title "${TITLE}" \
              --notes-file release_notes.md
          fi
          echo "Done: ${TAG}"
