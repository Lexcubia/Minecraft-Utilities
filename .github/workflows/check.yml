name: check

on:
  # main/master 仅允许经 PR 合并；push 到默认分支不跑本工作流（避免与 PR 上已跑的检查重复）。
  push:
    branches-ignore:
      - main
      - master
    paths:
      - '.github/workflows/check.yml'
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'eslint.config.ts'
      - 'vitest.config.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'prettier.config.js'
      - 'lint-staged.config.js'
      - 'python/**'
      - 'pyproject.toml'
      - 'tests/**'
      - 'docs/**/*.md'
      - '.markdownlint.json'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/check.yml'
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'eslint.config.ts'
      - 'vitest.config.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'prettier.config.js'
      - 'lint-staged.config.js'
      - 'python/**'
      - 'pyproject.toml'
      - 'tests/**'
      - 'docs/**/*.md'
      - '.markdownlint.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check python tests
      - name: Ruff format
        run: ruff format --check python tests
