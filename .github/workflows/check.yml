name: check

on:
  # 合并进 main 之前的门禁：仅在 PR → main/master 时运行；main 上 push 仅触发 desktop-release。
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/check.yml'
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'eslint.config.ts'
      - 'vitest.config.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'prettier.config.js'
      - 'lint-staged.config.js'
      - 'scripts/**'
      - 'python/**'
      - 'pyproject.toml'
      - 'src-tauri/**'
      - 'tests/**'
      - 'docs/**/*.md'
      - '.markdownlint.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check python tests
      - name: Ruff format
        run: ruff format --check python tests

  tauri:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust toolchain
        run: |
          set -euo pipefail
          command -v cargo
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> build/cargo-target

      - name: cargo check (Tauri backend)
        run: pnpm check:tauri
